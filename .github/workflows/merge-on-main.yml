name: Build, Test & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # status check Lighthouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test_resend_api_key_for_ci' }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL || 'test@example.com' }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET || 'test_csrf_secret_for_ci_at_least_32_chars' }}

      - name: Start Next.js server
        run: pnpm start > next-start.log 2>&1 &
        env:
          NODE_ENV: production
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test_resend_api_key_for_ci' }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL || 'test@example.com' }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET || 'test_csrf_secret_for_ci_at_least_32_chars' }}

      - name: Wait for Next.js to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf --max-time 5 -o /dev/null http://localhost:3000 && exit 0
            sleep 2
          done
          echo "Le serveur Next.js n'a pas répondu en 60 s"
          cat next-start.log
          exit 1

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Run Lighthouse CI
        continue-on-error: true
        run: pnpm lhci
        env:
          CHROME_PATH: /usr/bin/chromium-browser
          # LHCI_GITHUB_TOKEN parle directement à l'API GitHub
          # (LHCI_GITHUB_APP_TOKEN enverrait le token à l'infra Lighthouse)
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Cloudflare Pages
        run: pnpm pages:build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test_resend_api_key_for_ci' }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL || 'test@example.com' }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET || 'test_csrf_secret_for_ci_at_least_32_chars' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=clubs-en-action
