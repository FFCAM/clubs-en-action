name: Build, Test & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write # status check Lighthouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true # sinon la 24.x en cache du runner, parfois sans les derniers correctifs

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test_resend_api_key_for_ci' }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL || 'test@example.com' }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET || 'test_csrf_secret_for_ci_at_least_32_chars' }}

      - name: Start Next.js server
        run: pnpm start > next-start.log 2>&1 &
        env:
          NODE_ENV: production
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test_resend_api_key_for_ci' }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL || 'test@example.com' }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET || 'test_csrf_secret_for_ci_at_least_32_chars' }}

      - name: Wait for Next.js to be ready
        run: |
          for i in $(seq 1 30); do
            curl -sf --max-time 5 -o /dev/null http://localhost:3000 && exit 0
            sleep 2
          done
          echo "Le serveur Next.js n'a pas répondu en 60 s"
          cat next-start.log
          exit 1

      - name: Run Lighthouse CI
        continue-on-error: true
        run: pnpm lhci
        env:
          # Google Chrome est préinstallé sur les runners ubuntu-latest (24.04 et 26.04)
          CHROME_PATH: /usr/bin/google-chrome
          # LHCI_GITHUB_TOKEN parle directement à l'API GitHub
          # (LHCI_GITHUB_APP_TOKEN enverrait le token à l'infra Lighthouse)
          LHCI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build for Cloudflare Pages
        run: pnpm pages:build
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 'test_resend_api_key_for_ci' }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL || 'test@example.com' }}
          CSRF_SECRET: ${{ secrets.CSRF_SECRET || 'test_csrf_secret_for_ci_at_least_32_chars' }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=clubs-en-action
